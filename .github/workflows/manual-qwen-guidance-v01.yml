name: Manual Qwen guidance benchmark V01

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stories-of-us-manual-qwen-guidance-v01
  cancel-in-progress: false

jobs:
  qwen-guidance-benchmark:
    name: qwen-guidance-v01
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLAMA_CPP_REVISION: 792fcf4e7501972b595d3aeeb85153f9926f6aef
      MODEL_ID: qwen3-4b-q4-k-m
      MODEL_REVISION: bc640142c66e1fdd12af0bd68f40445458f3869b
      MODEL_FILENAME: Qwen3-4B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf
      MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
    steps:
      - name: Check out benchmark files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate frozen public-safe package
        id: validation
        run: |
          set -euo pipefail
          python3 benchmark/qwen-guidance-v01/validate.py
          python3 benchmark/qwen-guidance-v01/test_runner.py

      - name: Build pinned llama.cpp CPU runtime
        id: build
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_REVISION"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release -j2 --target llama-cli

      - name: Download and verify Qwen
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models" benchmark/results/qwen-guidance-v01
          curl --fail --location --retry 2 --max-time 600 --output "$RUNNER_TEMP/models/$MODEL_FILENAME" "$MODEL_URL"
          echo "$MODEL_SHA256  $RUNNER_TEMP/models/$MODEL_FILENAME" | sha256sum --check --strict

      - name: Run frozen three-condition benchmark
        id: inference
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmark/qwen-guidance-v01/run_qwen_guidance.py \
            --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model "$RUNNER_TEMP/models/$MODEL_FILENAME" \
            --expected-sha256 "$MODEL_SHA256" \
            --model-id "$MODEL_ID" \
            --model-revision "$MODEL_REVISION" \
            --cases benchmark/qwen-guidance-v01/cases.json \
            --conditions benchmark/qwen-guidance-v01/conditions.json \
            --examples benchmark/qwen-guidance-v01/style_examples.json \
            --output benchmark/results/qwen-guidance-v01/results.json \
            --timeout-seconds 240

      - name: Record bounded storage use
        if: always()
        shell: bash
        run: |
          mkdir -p benchmark/results/qwen-guidance-v01
          du -sh benchmark/results/qwen-guidance-v01 "$RUNNER_TEMP/llama.cpp" 2>/dev/null > benchmark/results/qwen-guidance-v01/storage.txt || true

      - name: Remove temporary model weights
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/models/$MODEL_FILENAME"

      - name: Upload public-safe benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-qwen-guidance-v01-results
          path: |
            benchmark/results/qwen-guidance-v01/results.json
            benchmark/results/qwen-guidance-v01/storage.txt
            benchmark/qwen-guidance-v01/validation_results.json
          retention-days: 7
          if-no-files-found: error
