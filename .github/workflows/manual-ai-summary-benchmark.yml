name: Manual AI summary benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stories-of-us-manual-ai-summary-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLAMA_CPP_REVISION: 792fcf4e7501972b595d3aeeb85153f9926f6aef
    steps:
      - name: Check out benchmark files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate public-safe package
        run: python3 benchmark/validate.py

      - name: Build pinned llama.cpp CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_REVISION"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release -j2 --target llama-cli

      - name: Download, verify and run Granite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models" benchmark/results
          curl --fail --location --retry 2 --max-time 600 --output "$RUNNER_TEMP/models/granite.gguf" "https://huggingface.co/ibm-granite/granite-3.3-2b-instruct-GGUF/resolve/7cdf86ccd1f1bb3491c9b7017b033f2e51367397/granite-3.3-2b-instruct-Q4_K_M.gguf"
          echo "ac71e9e32c0bea919b409c5918f69ca74339854b0319c5065e4e9fb6d95c4852  $RUNNER_TEMP/models/granite.gguf" | sha256sum --check --strict
          python3 benchmark/run_benchmark.py --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --model "$RUNNER_TEMP/models/granite.gguf" --expected-sha256 ac71e9e32c0bea919b409c5918f69ca74339854b0319c5065e4e9fb6d95c4852 --model-id granite-3.3-2b-instruct-q4-k-m --cases benchmark/cases.json --output benchmark/results/granite.json
          rm -f "$RUNNER_TEMP/models/granite.gguf"

      - name: Download, verify and run Qwen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 600 --output "$RUNNER_TEMP/models/qwen.gguf" "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf"
          echo "7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5  $RUNNER_TEMP/models/qwen.gguf" | sha256sum --check --strict
          python3 benchmark/run_benchmark.py --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --model "$RUNNER_TEMP/models/qwen.gguf" --expected-sha256 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5 --model-id qwen3-4b-q4-k-m --cases benchmark/cases.json --output benchmark/results/qwen.json
          rm -f "$RUNNER_TEMP/models/qwen.gguf"

      - name: Record bounded disk use
        shell: bash
        run: du -sh benchmark/results "$RUNNER_TEMP/llama.cpp" | tee benchmark/results/storage.txt

      - name: Upload public-safe benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-ai-summary-results
          path: benchmark/results/
          retention-days: 7
          if-no-files-found: error
