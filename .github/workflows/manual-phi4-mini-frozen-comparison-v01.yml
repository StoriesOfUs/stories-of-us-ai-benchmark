name: Manual Phi-4-mini frozen comparison V01

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stories-of-us-manual-phi4-mini-frozen-comparison-v01
  cancel-in-progress: false

jobs:
  phi4-mini-frozen-comparison:
    name: phi4-mini-frozen-comparison-v01
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLAMA_CPP_REVISION: 792fcf4e7501972b595d3aeeb85153f9926f6aef
      MODEL_FILENAME: microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/7ff82c2aaa4dde30121698a973765f39be5288c0/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
      MODEL_SHA256: 01999f17c39cc3074afae5e9c539bc82d45f2dd7faa3917c66cbef76fce8c0c2
      PACKAGE_DIR: benchmark/phi4-mini-frozen-comparison-v01
      RESULT_DIR: benchmark/results/phi4-mini-frozen-comparison-v01
    steps:
      - name: Check out benchmark files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate frozen public-safe package
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            "$PACKAGE_DIR/code/run_phi_comparison.py" \
            "$PACKAGE_DIR/code/validate_public_package.py" \
            "$PACKAGE_DIR/tests/test_phi_comparison.py"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m unittest discover \
            -s "$PACKAGE_DIR/tests" -p 'test_*.py' -v
          python3 "$PACKAGE_DIR/code/validate_public_package.py" \
            | tee "$RESULT_DIR/package_validation_v01.json"

      - name: Record resource preflight
        id: preflight
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          lscpu > "$RESULT_DIR/runner_cpu_preflight.txt"
          free -h > "$RESULT_DIR/runner_memory_preflight.txt"
          df -h > "$RESULT_DIR/runner_storage_preflight.txt"

      - name: Build pinned llama.cpp CPU runtime
        id: build
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_REVISION"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release -j2 --target llama-cli
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --version \
            > "$RESULT_DIR/llama_cli_version.txt" 2>&1

      - name: Generate exactly two Phi summaries
        id: phi
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models" "$RESULT_DIR"
          trap 'rm -f "$RUNNER_TEMP/models/$MODEL_FILENAME"' EXIT
          curl --fail --location --retry 2 --max-time 900 \
            --output "$RUNNER_TEMP/models/$MODEL_FILENAME" "$MODEL_URL"
          echo "$MODEL_SHA256  $RUNNER_TEMP/models/$MODEL_FILENAME" | sha256sum --check --strict
          sha256sum "$RUNNER_TEMP/models/$MODEL_FILENAME" > "$RESULT_DIR/phi_model_file_hash.txt"
          python3 "$PACKAGE_DIR/code/run_phi_comparison.py" \
            --llama-binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model-file "$RUNNER_TEMP/models/$MODEL_FILENAME" \
            --model-manifest "$PACKAGE_DIR/fixtures/phi_model_manifest_v01.json" \
            --packets "$PACKAGE_DIR/fixtures/article_packets_frozen_v01.json" \
            --output "$RESULT_DIR/phi_results_v01.json" \
            --timeout-seconds 240

      - name: Preserve bounded execution evidence
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PHI_OUTCOME: ${{ steps.phi.outcome }}
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          python3 - <<'PY'
          import json, os, pathlib, platform
          target = pathlib.Path(os.environ["RESULT_DIR"]) / "execution_manifest_v01.json"
          target.write_text(json.dumps({
              "schema_version": "stories-of-us-phi4-mini-frozen-comparison-execution-manifest-v01",
              "public_label": "EXPERIMENTAL AI OUTPUT — NOT EDITORIALLY APPROVED — NOT FOR PUBLICATION",
              "runner": platform.platform(),
              "steps": {
                  "validation": os.environ.get("VALIDATION_OUTCOME", "unknown"),
                  "resource_preflight": os.environ.get("PREFLIGHT_OUTCOME", "unknown"),
                  "build": os.environ.get("BUILD_OUTCOME", "unknown"),
                  "phi_generation": os.environ.get("PHI_OUTCOME", "unknown")
              },
              "new_models": ["microsoft/Phi-4-mini-instruct"],
              "new_summary_slots": ["bbc_disabled_bay/PHI", "druk_dpo_funding/PHI"],
              "qwen_regenerated": False,
              "gemma_executed": False,
              "manual_dispatch_only": True,
              "additional_cost_gbp": 0,
              "operational_readiness": "NOT_AUTHORISED"
          }, indent=2) + "\n", encoding="utf-8")
          PY
          du -sh "$RESULT_DIR" "$RUNNER_TEMP/llama.cpp" "$RUNNER_TEMP/models" 2>/dev/null \
            > "$RESULT_DIR/storage.txt" || true
          free -h > "$RESULT_DIR/runner_memory_final.txt" 2>/dev/null || true
          df -h > "$RESULT_DIR/runner_storage_final.txt" 2>/dev/null || true

      - name: Upload public-safe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-phi4-mini-frozen-comparison-v01-results
          path: |
            benchmark/results/phi4-mini-frozen-comparison-v01/phi_results_v01.json
            benchmark/results/phi4-mini-frozen-comparison-v01/phi_model_file_hash.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/execution_manifest_v01.json
            benchmark/results/phi4-mini-frozen-comparison-v01/package_validation_v01.json
            benchmark/results/phi4-mini-frozen-comparison-v01/llama_cli_version.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/runner_cpu_preflight.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/runner_memory_preflight.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/runner_memory_final.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/runner_storage_preflight.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/runner_storage_final.txt
            benchmark/results/phi4-mini-frozen-comparison-v01/storage.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve real Phi failure status
        if: always()
        env:
          PHI_OUTCOME: ${{ steps.phi.outcome }}
        shell: bash
        run: test "$PHI_OUTCOME" = success
